{{ $site := .Site.Data.site.site }}

<nav data-nav class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-line">
  <div class="container-x flex items-center justify-between h-20">

    <!-- Logo -->
    <a href="/" class="flex items-center gap-3 shrink-0">
      <img src="/img/lww-logo.jpg" alt="{{ $site.name }}" class="h-12 w-auto">
    </a>

    <!-- Desktop nav -->
    <ul class="hidden lg:flex items-center gap-1 text-sm font-semibold text-ink">
      <li><a href="{{ .Site.Home.RelPermalink }}" class="px-3 py-2 rounded hover:text-brand transition">Home</a></li>
      <li><a href="{{ (`/about/` | relLangURL) }}" class="px-3 py-2 rounded hover:text-brand transition">Profile</a></li>
      <li><a href="{{ (`/solutions/` | relLangURL) }}" class="px-3 py-2 rounded hover:text-brand transition">Solution</a></li>
      <li><a href="{{ (`/partners/` | relLangURL) }}" class="px-3 py-2 rounded hover:text-brand transition">Partner &amp; Client</a></li>
      <li><a href="{{ (`/awards/` | relLangURL) }}" class="px-3 py-2 rounded hover:text-brand transition">Awards</a></li>
    </ul>

    <!-- Right side: language + mobile menu -->
    <div class="flex items-center gap-2 sm:gap-3">
      {{ partial "lang-switcher" . }}

      <button data-mobile-menu
              class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-md border border-line text-ink"
              aria-label="Toggle menu" aria-expanded="false">
        <svg class="mobile-menu-icon w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line class="menu-icon-top" x1="3" y1="6" x2="21" y2="6"/>
          <line class="menu-icon-middle" x1="3" y1="12" x2="21" y2="12"/>
          <line class="menu-icon-bottom" x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu (slide-down) -->
  <div class="mobile-menu-container lg:hidden border-t border-line bg-white">
    <ul class="container-x flex flex-col py-4 text-sm font-semibold text-ink">
      <li><a href="{{ .Site.Home.RelPermalink }}" class="block py-3 border-b border-line">Home</a></li>
      <li><a href="{{ (`/about/` | relLangURL) }}" class="block py-3 border-b border-line">Profile</a></li>
      <li><a href="{{ (`/solutions/` | relLangURL) }}" class="block py-3 border-b border-line">Solution</a></li>
      <li><a href="{{ (`/partners/` | relLangURL) }}" class="block py-3 border-b border-line">Partner &amp; Client</a></li>
      <li><a href="{{ (`/awards/` | relLangURL) }}" class="block py-3 border-b border-line">Awards</a></li>
      <li><a href="{{ (`/contact/` | relLangURL) }}" class="block py-3">Contact</a></li>
      <li class="pt-3">
        {{ partial "lang-switcher" . }}
      </li>
    </ul>
  </div>
</nav>
