<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" role="img" aria-label="Limawira Wisesa">
  <defs>
    <linearGradient id="lwGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b7431"/>
      <stop offset="1" stop-color="#384825"/>
    </linearGradient>
  </defs>

  <!-- Stylised LWW brush mark (an angular L with a dot, evoking current + energy) -->
  <g transform="translate(4,4)">
    <!-- L stem -->
    <path d="M8 4 L8 36 L34 36 L34 28 L18 28 L18 4 Z" fill="url(#lwGrad)"/>
    <!-- Energy node -->
    <circle cx="36" cy="10" r="4" fill="#6f8d3f"/>
  </g>

  <!-- Wordmark -->
  <g font-family="Plus Jakarta Sans, Inter, system-ui, sans-serif" fill="#2a3620" font-weight="800" letter-spacing="1">
    <text x="60" y="26" font-size="18">LIMAWIRA</text>
    <text x="60" y="46" font-size="11" fill="#475b29" letter-spacing="3">WISESA</text>
  </g>
</svg>
