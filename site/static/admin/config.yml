# ----------------------------------------------------------------------
# Decap CMS configuration for PT Limawira Wisesa
# ----------------------------------------------------------------------
# This file is the single source of truth for what marketing content
# is editable from /admin. Every field used in the Hugo templates has
# a matching widget here. Anything not editable has a default in the
# data files or templates.
# ----------------------------------------------------------------------

backend:
  name: git-gateway
  branch: main

# Where uploaded media is committed in the repo
media_folder: "site/static/img"
public_folder: "img"

# Use subfolders per media type so editors can find files
# (Decap uses the public_folder above, the subfolder is just a UI hint)

# Local backend is enabled by netlify.toml / proxy for local development
local_backend: true

# Friendly editor settings
site_url: https://dev-lww-landing.netlify.app
display_url: https://dev-lww-landing.netlify.app
logo_url: /img/logo.svg

# Allow editors to publish from a friendly UI
publish_mode: editorial_workflow

# Custom preview templates (render the page the way it will look on the site)
preview_path: "previews/index.html"

# ----------------------------------------------------------------------
# Collections
# ----------------------------------------------------------------------
# Decap CMS does not have native multilingual content collection support,
# so each language gets its own collection. Default language is Indonesian
# (lives at the URL root). English is the secondary language (lives under
# /en/). Editors translate a page by opening both English and Indonesian
# entries side-by-side; Hugo pairs them automatically because the file
# paths under /site/content.en/ mirror the Indonesian tree.
# ----------------------------------------------------------------------
collections:

  # ============================================================
  # PAGES — BAHASA INDONESIA (default language, lives at URL root)
  # ============================================================
  - name: "pages"
    label: "Pages — Bahasa Indonesia"
    label_singular: "Halaman (ID)"
    description: "Versi Bahasa Indonesia dari semua halaman utama. Path-nya mengikuti mirror di site/content/."
    files:

      # ----------------------- BERANDA (HOME) -----------------------
      - file: "site/content/_index.md"
        label: "Beranda"
        name: "home"
        description: "Hero, quick links, stats, solutions, partners, CTA"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - {label: "Eyebrow (label kecil di atas judul)", name: "eyebrow", widget: "string", default: "Since 1985"}
              - {label: "Judul utama", name: "heading", widget: "string"}
              - {label: "Tagline (subjudul)", name: "tagline", widget: "text"}
              - {label: "Hero image", name: "image", widget: "image", allow_multiple: false}
              - label: "Tombol CTA utama"
                name: "primaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - label: "Tombol CTA sekunder"
                name: "secondaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

          - label: "Quick icons row (di bawah hero)"
            name: "quickIcons"
            widget: "object"
            fields:
              - {label: "Judul", name: "title", widget: "string", default: "Apa yang kami kerjakan, sekilas"}
              - label: "Item"
                name: "items"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
                  - {label: "Ikon (upload file SVG)", name: "icon", widget: "image", allow_multiple: false, hint: "Upload file .svg ke folder /img/icons/ (atau gunakan ikon yang sudah ada di sana)."}

          - label: "Stats bar (strip hijau)"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - {label: "Value (mis. 40+)", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}

          - label: "Solutions grid (enam kartu — dibaca dari koleksi Solutions ID)"
            name: "solutions"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string", default: "Apa yang kami kerjakan"}
              - {label: "Judul", name: "title", widget: "string"}
              - {label: "Subjudul", name: "subtitle", widget: "text"}
              - {label: "Hint", name: "body", widget: "hidden", default: "Kartu dibaca dari koleksi 'Solutions — Bahasa Indonesia' di bawah"}

          - label: "Partners strip"
            name: "partners"
            widget: "object"
            fields:
              - {label: "Judul", name: "title", widget: "string", default: "Partner Kami"}
              - {label: "Subjudul", name: "subtitle", widget: "text"}
              - label: "CTA"
                name: "cta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

          - label: "Bottom CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Teks", name: "text", widget: "text"}
              - label: "Tombol utama"
                name: "primaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - label: "Tombol sekunder"
                name: "secondaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

      # ----------------------- TENTANG (ABOUT) -----------------------
      - file: "site/content/about/_index.md"
        label: "Tentang Kami"
        name: "about"
        description: "Cerita perusahaan, visi, misi, nilai, statistik"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Eyebrow (tagline)", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Paragraf intro", name: "intro", widget: "text"}

          - label: "Stats"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - {label: "Value", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}

          - label: "Story timeline"
            name: "story"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - {label: "Tahun / periode", name: "year", widget: "string"}
              - {label: "Judul", name: "title", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}

          - label: "Visi"
            name: "vision"
            widget: "object"
            fields:
              - {label: "Judul", name: "title", widget: "string", default: "Visi"}
              - {label: "Teks", name: "text", widget: "text"}

          - label: "Misi"
            name: "mission"
            widget: "object"
            fields:
              - {label: "Judul", name: "title", widget: "string", default: "Misi"}
              - label: "Item"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Pernyataan", name: "", widget: "string"}

          - label: "Nilai"
            name: "values"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Judul", name: "title", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}

          - label: "Bottom CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Teks", name: "text", widget: "text"}
              - {label: "Tombol", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

      # ----------------------- KONTAK (CONTACT) -----------------------
      - file: "site/content/contact/_index.md"
        label: "Kontak"
        name: "contact"
        description: "Saluran, jam operasional, dan definisi formulir"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Saluran kontak"
            name: "channels"
            widget: "list"
            summary: "{{fields.label}} — {{fields.value}}"
            fields:
              - label: "Ikon"
                name: "icon"
                widget: "select"
                options: ["phone", "whatsapp", "mail", "pin"]
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Nilai tampilan", name: "value", widget: "string"}
              - {label: "URL (tel:, mailto:, https://wa.me/..., dll.)", name: "url", widget: "string"}
          - label: "Jam operasional"
            name: "hours"
            widget: "list"
            summary: "{{fields.day}} — {{fields.time}}"
            fields:
              - {label: "Hari / periode", name: "day", widget: "string"}
              - {label: "Waktu", name: "time", widget: "string"}
          - label: "Formulir"
            name: "form"
            widget: "object"
            fields:
              - {label: "Label tombol kirim", name: "submitLabel", widget: "string", default: "Kirim pesan"}
              - {label: "Pesan sukses (setelah submit)", name: "successMessage", widget: "string"}
              - label: "Field formulir"
                name: "fields"
                widget: "list"
                summary: "{{fields.label}} ({{fields.type}})"
                fields:
                  - {label: "Nama field (HTML name attr)", name: "name", widget: "string"}
                  - {label: "Label untuk pengguna", name: "label", widget: "string"}
                  - label: "Tipe"
                    name: "type"
                    widget: "select"
                    options: ["text", "email", "tel", "textarea", "select"]
                  - {label: "Wajib?", name: "required", widget: "boolean", default: false}
                  - label: "Opsi (hanya untuk type=select)"
                    name: "options"
                    widget: "list"
                    required: false
                    field: {label: "Opsi", name: "", widget: "string"}

      # ----------------------- PELANGGAN (CUSTOMERS) -----------------------
      - file: "site/content/customers/_index.md"
        label: "Pelanggan"
        name: "customers"
        description: "Daftar pelanggan dikelompokkan per solusi"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - label: "Grup pelanggan"
            name: "groups"
            widget: "list"
            summary: "{{fields.title}} ({{fields.customers.length}} pelanggan)"
            fields:
              - {label: "Judul grup (mis. Data Center)", name: "title", widget: "string"}
              - label: "Pelanggan"
                name: "customers"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - {label: "Nama pelanggan", name: "name", widget: "string"}
                  - {label: "Industri", name: "industry", widget: "string"}
                  - {label: "Logo (opsional)", name: "logo", widget: "image", required: false}

      # ----------------------- PARTNER (PARTNERS) -----------------------
      - file: "site/content/partners/_index.md"
        label: "Partner"
        name: "partners"
        description: "Mitra teknologi dan OEM"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Partner"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - {label: "Nama", name: "name", widget: "string"}
              - {label: "Kategori", name: "category", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image", required: false}
              - {label: "URL website", name: "url", widget: "string", required: false}

      # ----------------------- PENGHARGAAN (AWARDS) -----------------------
      - file: "site/content/awards/_index.md"
        label: "Penghargaan & Sertifikasi"
        name: "awards"
        description: "Sertifikasi, penghargaan, dan pengakuan"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Penghargaan (kelompok, masing-masing dengan banyak foto)"
            name: "awards"
            widget: "list"
            summary: "{{fields.name}} ({{fields.images.length}} foto)"
            fields:
              - {label: "Nama penghargaan", name: "name", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text", required: false}
              - label: "Foto-foto (upload banyak)"
                name: "images"
                widget: "list"
                summary: "{{fields.image}}"
                field: {label: "File gambar", name: "image", widget: "image"}
          - label: "Sertifikasi"
            name: "certifications"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Nama", name: "name", widget: "string"}
              - {label: "Deskripsi", name: "description", widget: "text"}
              - {label: "Diterbitkan oleh", name: "issuedBy", widget: "string"}
              - {label: "Gambar / scan sertifikat", name: "image", widget: "image", required: false}
              - {label: "File PDF sertifikat (opsional)", name: "file", widget: "file", required: false}

      # ----------------------- SOLUTIONS (indeks) -----------------------
      - file: "site/content/solutions/_index.md"
        label: "Solutions (ID) — Halaman Indeks"
        name: "solutions-index"
        description: "Teks header untuk halaman daftar /solutions/"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}

      # ----------------------- THANK YOU (post-submit) -----------------------
      - file: "site/content/thank-you.md"
        label: "Halaman Terima Kasih"
        name: "thank-you"
        description: "Halaman yang muncul setelah pengunjung mengirim formulir kontak."
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Meta description", name: "description", widget: "text"}
          - {label: "Isi halaman (markdown)", name: "body", widget: "markdown"}

  # ============================================================
  # SOLUTIONS — BAHASA INDONESIA (each solution = a markdown file)
  # ============================================================
  - name: "solutions"
    label: "Solutions — Bahasa Indonesia"
    label_singular: "Solution (ID)"
    description: "Setiap solusi punya halaman landing (Data Center, UPS, ICT, dll.) dalam Bahasa Indonesia"
    folder: "site/content/solutions"
    path: "{{slug}}"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL slug (mis. data-center)", name: "slug", widget: "string", hint: "Lowercase, hyphenated. Harus cocok dengan slug solusi Bahasa Inggris di koleksi 'Solutions — English'."}
      - {label: "Sort order (lower = first)", name: "order", widget: "number", default: 99, value_type: "int", hint: "Mengontrol urutan di halaman daftar"}
      - label: "Ikon"
        name: "icon"
        widget: "select"
        default: "server"
        options: ["server", "battery", "network", "bolt", "wrench", "building", "leaf", "shield", "monitor"]
      - {label: "Deskripsi singkat (untuk kartu)", name: "shortDescription", widget: "text"}
      - label: "Hero"
        name: "hero"
        widget: "object"
        fields:
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Image", name: "image", widget: "image"}
      - {label: "Deskripsi panjang", name: "description", widget: "markdown"}
      - label: "Fitur (3 kartu)"
        name: "features"
        widget: "list"
        summary: "{{fields.title}}"
        fields:
          - {label: "Judul", name: "title", widget: "string"}
          - {label: "Deskripsi", name: "description", widget: "text"}
          - label: "Ikon"
            name: "icon"
            widget: "select"
            options: ["server", "battery", "network", "bolt", "wrench", "building", "leaf", "shield", "monitor", "calculator", "plug", "blueprint", "hammer", "router", "cable", "transformer", "generator", "beaker", "clipboard", "box", "dashboard"]
      - label: "Spesifikasi (Sekilas)"
        name: "specs"
        widget: "list"
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Nilai", name: "value", widget: "string"}
      - label: "Pelanggan terpilih"
        name: "customers"
        widget: "list"
        summary: "{{fields.name}}"
        fields:
          - {label: "Nama pelanggan", name: "name", widget: "string"}
          - {label: "Logo (opsional)", name: "logo", widget: "image", required: false}
      - label: "Bottom CTA"
        name: "cta"
        widget: "object"
        fields:
          - {label: "Label tombol", name: "label", widget: "string"}
          - {label: "URL (gunakan path /id/ untuk link internal Bahasa Indonesia)", name: "url", widget: "string"}
      - {label: "Body (markdown, opsional)", name: "body", widget: "markdown", required: false}

  # ============================================================
  # POSTS — BAHASA INDONESIA (blog/insights)
  # ============================================================
  - name: "posts"
    label: "Posts — Bahasa Indonesia"
    label_singular: "Post (ID)"
    description: "Berita, insight, dan pengumuman proyek dalam Bahasa Indonesia"
    folder: "site/content/posts"
    path: "{{slug}}"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Tanggal publikasi"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        picker_utc: true
      - {label: "Penulis", name: "author", widget: "string", required: false}
      - {label: "Intro / deskripsi", name: "description", widget: "text"}
      - {label: "Hero image", name: "image", widget: "image", required: false}
      - {label: "Tags (koma dipisahkan)", name: "tags", widget: "list", required: false, field: {label: "Tag", name: "", widget: "string"}}
      - {label: "Body (markdown)", name: "body", widget: "markdown"}

  # ============================================================
  # PAGES — ENGLISH (lives under /en/)
  # ============================================================
  - name: "pages_en"
    label: "Pages — English"
    label_singular: "Page (EN)"
    description: "English version of every top-level page. Files live under site/content.en/."
    files:

      - file: "site/content.en/_index.md"
        label: "Home Page"
        name: "home_en"
        description: "Hero, quick links, stats, solutions overview, partners, CTA"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            collapsed: false
            fields:
              - {label: "Eyebrow (small label above heading)", name: "eyebrow", widget: "string", default: "Since 1985"}
              - {label: "Main heading", name: "heading", widget: "string"}
              - {label: "Tagline (subheading)", name: "tagline", widget: "text"}
              - {label: "Hero image", name: "image", widget: "image", allow_multiple: false}
              - label: "Primary CTA button"
                name: "primaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - label: "Secondary CTA button"
                name: "secondaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

          - label: "Quick icons row (below hero)"
            name: "quickIcons"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "What we do, at a glance"}
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
                  - {label: "Icon (upload SVG file)", name: "icon", widget: "image", allow_multiple: false, hint: "Upload a .svg file into /img/icons/ (or use an existing one)."}

          - label: "Stats bar (green strip)"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - {label: "Value (e.g. 40+)", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}

          - label: "Solutions grid (six cards — read from the English Solutions collection)"
            name: "solutions"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string", default: "What we do"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
              - {label: "Hint", name: "body", widget: "hidden", default: "Cards are pulled from the English Solutions collection"}

          - label: "Partners strip"
            name: "partners"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Our Partners"}
              - {label: "Subtitle", name: "subtitle", widget: "text"}
              - label: "CTA"
                name: "cta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

          - label: "Bottom CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Eyebrow", name: "eyebrow", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - label: "Primary button"
                name: "primaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}
              - label: "Secondary button"
                name: "secondaryCta"
                widget: "object"
                fields:
                  - {label: "Label", name: "label", widget: "string"}
                  - {label: "URL", name: "url", widget: "string"}

      - file: "site/content.en/about/_index.md"
        label: "About Page"
        name: "about_en"
        description: "Company story, vision, mission, values, stats"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Eyebrow (tagline)", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro paragraph", name: "intro", widget: "text"}

          - label: "Stats"
            name: "stats"
            widget: "list"
            summary: "{{fields.value}} — {{fields.label}}"
            fields:
              - {label: "Value", name: "value", widget: "string"}
              - {label: "Label", name: "label", widget: "string"}

          - label: "Story timeline"
            name: "story"
            widget: "list"
            summary: "{{fields.year}} — {{fields.title}}"
            fields:
              - {label: "Year / period", name: "year", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

          - label: "Vision"
            name: "vision"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Vision"}
              - {label: "Text", name: "text", widget: "text"}

          - label: "Mission"
            name: "mission"
            widget: "object"
            fields:
              - {label: "Title", name: "title", widget: "string", default: "Mission"}
              - label: "Items"
                name: "items"
                widget: "list"
                fields:
                  - {label: "Statement", name: "", widget: "string"}

          - label: "Values"
            name: "values"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}

          - label: "Bottom CTA"
            name: "cta"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Text", name: "text", widget: "text"}
              - {label: "Button", name: "label", widget: "string"}
              - {label: "URL", name: "url", widget: "string"}

      - file: "site/content.en/contact/_index.md"
        label: "Contact Page"
        name: "contact_en"
        description: "Channels, hours, and form definition"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Contact channels"
            name: "channels"
            widget: "list"
            summary: "{{fields.label}} — {{fields.value}}"
            fields:
              - label: "Icon"
                name: "icon"
                widget: "select"
                options: ["phone", "whatsapp", "mail", "pin"]
              - {label: "Label", name: "label", widget: "string"}
              - {label: "Display value", name: "value", widget: "string"}
              - {label: "URL (tel:, mailto:, https://wa.me/..., etc.)", name: "url", widget: "string"}
          - label: "Business hours"
            name: "hours"
            widget: "list"
            summary: "{{fields.day}} — {{fields.time}}"
            fields:
              - {label: "Day / period", name: "day", widget: "string"}
              - {label: "Time", name: "time", widget: "string"}
          - label: "Form"
            name: "form"
            widget: "object"
            fields:
              - {label: "Submit button label", name: "submitLabel", widget: "string", default: "Send message"}
              - {label: "Success message (after submit)", name: "successMessage", widget: "string"}
              - label: "Form fields"
                name: "fields"
                widget: "list"
                summary: "{{fields.label}} ({{fields.type}})"
                fields:
                  - {label: "Field name (HTML name attr)", name: "name", widget: "string"}
                  - {label: "Label shown to user", name: "label", widget: "string"}
                  - label: "Type"
                    name: "type"
                    widget: "select"
                    options: ["text", "email", "tel", "textarea", "select"]
                  - {label: "Required?", name: "required", widget: "boolean", default: false}
                  - label: "Options (only for type=select)"
                    name: "options"
                    widget: "list"
                    required: false
                    field: {label: "Option", name: "", widget: "string"}

      - file: "site/content.en/customers/_index.md"
        label: "Customers Page"
        name: "customers_en"
        description: "Showcase of customers grouped by solution"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - label: "Customer groups"
            name: "groups"
            widget: "list"
            summary: "{{fields.title}} ({{fields.customers.length}} customers)"
            fields:
              - {label: "Group title (e.g. Data Center)", name: "title", widget: "string"}
              - label: "Customers"
                name: "customers"
                widget: "list"
                summary: "{{fields.name}}"
                fields:
                  - {label: "Customer name", name: "name", widget: "string"}
                  - {label: "Industry", name: "industry", widget: "string"}
                  - {label: "Logo (optional)", name: "logo", widget: "image", required: false}

      - file: "site/content.en/partners/_index.md"
        label: "Partners Page"
        name: "partners_en"
        description: "Technology partners and OEMs"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Partners"
            name: "partners"
            widget: "list"
            summary: "{{fields.name}} — {{fields.category}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Category", name: "category", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image", required: false}
              - {label: "Website URL", name: "url", widget: "string", required: false}

      - file: "site/content.en/awards/_index.md"
        label: "Awards & Certifications"
        name: "awards_en"
        description: "Certifications, awards, and recognitions"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}
          - label: "Awards (groups, each with multiple photos)"
            name: "awards"
            widget: "list"
            summary: "{{fields.name}} ({{fields.images.length}} photos)"
            fields:
              - {label: "Award name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text", required: false}
              - label: "Photos (upload multiple)"
                name: "images"
                widget: "list"
                summary: "{{fields.image}}"
                field: {label: "Image file", name: "image", widget: "image"}
          - label: "Certifications"
            name: "certifications"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Issued by", name: "issuedBy", widget: "string"}
              - {label: "Image / certificate scan", name: "image", widget: "image", required: false}
              - {label: "PDF certificate file (optional)", name: "file", widget: "file", required: false}

      - file: "site/content.en/solutions/_index.md"
        label: "Solutions Page (index)"
        name: "solutions-index_en"
        description: "Header copy for the /en/solutions/ listing page"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Image", name: "image", widget: "image"}
          - {label: "Intro", name: "intro", widget: "text"}

      # ----------------------- THANK YOU (post-submit) -----------------------
      - file: "site/content.en/thank-you.md"
        label: "Thank You Page"
        name: "thank-you_en"
        description: "Landing page shown after a visitor submits the contact form."
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Meta description", name: "description", widget: "text"}
          - {label: "Page body (markdown)", name: "body", widget: "markdown"}

  # ============================================================
  # SOLUTIONS — ENGLISH
  # ============================================================
  - name: "solutions_en"
    label: "Solutions — English"
    label_singular: "Solution (EN)"
    description: "Each solution has its own landing page in English (Data Center, UPS, ICT, etc.)"
    folder: "site/content.en/solutions"
    path: "{{slug}}"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "URL slug (e.g. data-center)", name: "slug", widget: "string", hint: "Lowercase, hyphenated. Must match the slug of the Indonesian solution in 'Solutions — Bahasa Indonesia'."}
      - {label: "Sort order (lower = first)", name: "order", widget: "number", default: 99, value_type: "int", hint: "Controls the order shown on the listing page"}
      - label: "Icon"
        name: "icon"
        widget: "select"
        default: "server"
        options: ["server", "battery", "network", "bolt", "wrench", "building", "leaf", "shield", "monitor"]
      - {label: "Short description (used in cards)", name: "shortDescription", widget: "text"}
      - label: "Hero"
        name: "hero"
        widget: "object"
        fields:
          - {label: "Tagline", name: "tagline", widget: "string"}
          - {label: "Heading", name: "heading", widget: "string"}
          - {label: "Image", name: "image", widget: "image"}
      - {label: "Long description", name: "description", widget: "markdown"}
      - label: "Features (3 cards)"
        name: "features"
        widget: "list"
        summary: "{{fields.title}}"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Description", name: "description", widget: "text"}
          - label: "Icon"
            name: "icon"
            widget: "select"
            options: ["server", "battery", "network", "bolt", "wrench", "building", "leaf", "shield", "monitor", "calculator", "plug", "blueprint", "hammer", "router", "cable", "transformer", "generator", "beaker", "clipboard", "box", "dashboard"]
      - label: "Specs (At a glance)"
        name: "specs"
        widget: "list"
        summary: "{{fields.label}}: {{fields.value}}"
        fields:
          - {label: "Label", name: "label", widget: "string"}
          - {label: "Value", name: "value", widget: "string"}
      - label: "Selected customers"
        name: "customers"
        widget: "list"
        summary: "{{fields.name}}"
        fields:
          - {label: "Customer name", name: "name", widget: "string"}
          - {label: "Logo (optional)", name: "logo", widget: "image", required: false}
      - label: "Bottom CTA"
        name: "cta"
        widget: "object"
        fields:
          - {label: "Button label", name: "label", widget: "string"}
          - {label: "URL", name: "url", widget: "string"}
      - {label: "Body (markdown, optional)", name: "body", widget: "markdown", required: false}

  # ============================================================
  # POSTS — ENGLISH (blog/insights)
  # ============================================================
  - name: "posts_en"
    label: "Posts — English"
    label_singular: "Post (EN)"
    description: "News, insights, and project announcements in English"
    folder: "site/content.en/posts"
    path: "{{slug}}"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - label: "Publish date"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        picker_utc: true
      - {label: "Author", name: "author", widget: "string", required: false}
      - {label: "Intro / description", name: "description", widget: "text"}
      - {label: "Hero image", name: "image", widget: "image", required: false}
      - {label: "Tags (comma separated)", name: "tags", widget: "list", required: false, field: {label: "Tag", name: "", widget: "string"}}
      - {label: "Body (markdown)", name: "body", widget: "markdown"}
      - {label: "Hero image", name: "image", widget: "image", required: false}
      - {label: "Tags (comma separated)", name: "tags", widget: "list", required: false, field: {label: "Tag", name: "", widget: "string"}}
      - {label: "Body (markdown)", name: "body", widget: "markdown"}

  # ============================================================
  # SITE SETTINGS (global, single-instance)
  # ============================================================
  - name: "site_settings"
    label: "Site Settings"
    label_singular: "Site Setting"
    description: "Global brand, contact, social, and footer configuration"
    files:

      - file: "site/data/site.json"
        label: "Brand & Contact"
        name: "site"
        description: "Site name, tagline, phone, email, address, social links, and footer columns/certifications"
        fields:
          - label: "Brand"
            name: "site"
            widget: "object"
            fields:
              - {label: "Company name", name: "name", widget: "string", default: "PT Limawira Wisesa"}
              - {label: "Tagline (hero copy)", name: "tagline", widget: "string"}
              - {label: "Short description (used in previews)", name: "shortDescription", widget: "text"}
              - {label: "Since year (e.g. 1985)", name: "since", widget: "string"}
              - {label: "Display phone (e.g. +62 21 5890 3970)", name: "phone", widget: "string"}
              - {label: "Phone without spaces for tel: links (e.g. +622158903970)", name: "phoneRaw", widget: "string"}
              - {label: "WhatsApp number without + for wa.me links (e.g. 6281234567890)", name: "whatsapp", widget: "string"}
              - {label: "WhatsApp display (e.g. +62 812 3456 7890)", name: "whatsappDisplay", widget: "string"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "Address (city, country)", name: "address", widget: "string"}

          - label: "Social links"
            name: "social"
            widget: "object"
            fields:
              - {label: "LinkedIn URL", name: "linkedin", widget: "string", required: false}
              - {label: "Instagram URL", name: "instagram", widget: "string", required: false}
              - {label: "Facebook URL", name: "facebook", widget: "string", required: false}
              - {label: "YouTube URL", name: "youtube", widget: "string", required: false}

          - label: "Footer blurb"
            name: "footer"
            widget: "object"
            fields:
              - {label: "Blurb (under logo)", name: "blurb", widget: "text"}
              - label: "Footer columns"
                name: "columns"
                widget: "list"
                summary: "{{fields.heading}}"
                fields:
                  - {label: "Column heading", name: "heading", widget: "string"}
                  - label: "Links"
                    name: "links"
                    widget: "list"
                    summary: "{{fields.label}}"
                    fields:
                      - {label: "Label", name: "label", widget: "string"}
                      - {label: "URL", name: "url", widget: "string"}
              - label: "Certification badges (footer)"
                name: "certifications"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - {label: "Label (e.g. ISO 9001:2015)", name: "label", widget: "string"}
                  - {label: "Icon (reserved for future use)", name: "icon", widget: "string", required: false, default: "badge"}

      - file: "site/hugo.toml"
        label: "Hugo Config"
        name: "hugo_config"
        description: "Site title and global Hugo parameters"
        editor:
          preview: false
        fields:
          - {label: "Site title (browser tab)", name: "title", widget: "string"}
          - label: "Params"
            name: "params"
            widget: "object"
            fields:
              - {label: "Default description (meta tag)", name: "description", widget: "text"}
              - {label: "Default contact phone", name: "contactPhone", widget: "string"}
              - {label: "Default contact email", name: "contactEmail", widget: "string"}
              - {label: "Default contact address", name: "contactAddress", widget: "string"}
              - label: "Open Graph default image"
                name: "images"
                widget: "list"
                field: {label: "Image", name: "image", widget: "image"}
