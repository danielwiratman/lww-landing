  <script>
    // ---- shared helpers ----
    function val(entry, path, fallback) {
      if (!entry || !entry.data) return fallback;
      const parts = path.split(".");
      let v = entry.data;
      for (const p of parts) {
        if (v == null) return fallback;
        v = v[p];
      }
      return v == null ? fallback : v;
    }

    function esc(s) {
      if (s == null) return "";
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function imgUrl(s) {
      if (!s) return "";
      if (typeof s === "string") return s;
      return s.url || s.path || "";
    }

              <li><span class="px-3 py-2 rounded">Home</span></li>
              <li><span class="px-3 py-2 rounded">Solutions</span></li>
              <li><span class="px-3 py-2 rounded">Projects</span></li>
              <li><span class="px-3 py-2 rounded">Industries</span></li>
              <li><span class="px-3 py-2 rounded">About Us</span></li>
              <li><span class="px-3 py-2 rounded">Career</span></li>
            </ul>
            <div class="flex items-center gap-2">
              <span class="badge">Preview · ${esc(currentLabel)}</span>
            </div>
          </div>
        </nav>
      `;
    }

    function ctaBlock(cta) {
      if (!cta) return "";
      const primary = cta.primaryCta || cta;
      const secondary = cta.secondaryCta;
      const label = primary.label || cta.label;
      const url = primary.url || cta.url || "#";
      return `
        <section class="container-x my-24">
          <div class="relative overflow-hidden rounded-2xl bg-brand text-white px-6 py-14 md:px-12 md:py-20">
            <div class="absolute inset-0 dot-grid opacity-30"></div>
            <div class="absolute -top-10 -right-10 w-64 h-64 rounded-full bg-white/5 blur-3xl"></div>
            <div class="relative max-w-2xl">
              ${cta.eyebrow ? `<p class="text-sm font-semibold tracking-[0.2em] uppercase text-brand-200 mb-3">${esc(cta.eyebrow)}</p>` : ""}
              <h2 class="text-3xl md:text-4xl font-bold text-balance">${esc(cta.heading || label || "")}</h2>
              ${cta.text ? `<p class="mt-4 text-brand-100/90 max-w-xl">${esc(cta.text)}</p>` : ""}
              <div class="mt-8 flex flex-wrap gap-3">
                ${label ? `<a href="${esc(url)}" class="btn bg-white text-brand hover:bg-cream">${esc(label)} →</a>` : ""}
                ${secondary && secondary.label ? `<a href="${esc(secondary.url || "#")}" class="btn border border-white/30 text-white hover:bg-white/10">${esc(secondary.label)}</a>` : ""}
              </div>
            </div>
          </div>
        </section>
      `;
    }

    // ---- PAGE preview (Home / About / Contact / etc.) ----
    function renderPage() {
      const data = this.props.entry.get("data").toJS();
      const title = esc(data.title || "Untitled");
      const hero = data.hero || {};
      const heading = esc(hero.heading || title);
      const tagline = esc(hero.tagline || "");
      const eyebrow = esc(hero.eyebrow || "");
      const image = imgUrl(hero.image);
      const intro = esc(data.intro || data.description || "");

      let html = chrome("page");

      html += `
        <section class="relative overflow-hidden bg-white">
          <div class="container-x grid lg:grid-cols-2 gap-12 items-center py-20 md:py-28">
            <div>
              ${eyebrow ? `<p class="eyebrow mb-5">${eyebrow}</p>` : ""}
              <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight text-balance">${heading}</h1>
              ${tagline ? `<p class="mt-6 text-lg text-ink-muted max-w-xl text-pretty">${tagline}</p>` : ""}
              <div class="mt-8 flex flex-wrap items-center gap-3">
                ${hero.primaryCta && hero.primaryCta.label ? `<a href="${esc(hero.primaryCta.url || "#")}" class="btn-primary">${esc(hero.primaryCta.label)} →</a>` : ""}
                ${hero.secondaryCta && hero.secondaryCta.label ? `<a href="${esc(hero.secondaryCta.url || "#")}" class="btn-secondary">${esc(hero.secondaryCta.label)}</a>` : ""}
              </div>
            </div>
            <div class="relative">
              <div class="absolute -inset-4 bg-brand/10 rounded-2xl -rotate-3"></div>
              ${image
                ? `<img src="${esc(image)}" alt="" class="relative rounded-2xl w-full aspect-[4/3] object-cover" style="box-shadow: var(--shadow-soft);">`
                : `<div class="relative rounded-2xl w-full aspect-[4/3] bg-gradient-to-br from-brand to-brand-dark flex items-center justify-center text-white/40" style="box-shadow: var(--shadow-soft);"><span class="text-sm uppercase tracking-widest">Hero image</span></div>`
              }
            </div>
          </div>
        </section>
      `;

      if (intro) {
        html += `
          <section class="container-x py-12 md:py-16">
            <p class="text-lg text-ink-muted max-w-3xl leading-relaxed">${intro}</p>
          </section>
        `;
      }

      // quick icons strip
      if (data.quickIcons && Array.isArray(data.quickIcons.items)) {
        html += `
          <section class="border-y border-line bg-cream/40">
            <div class="container-x py-8">
              <p class="text-xs font-semibold tracking-[0.2em] uppercase text-ink-muted text-center mb-6">${esc(data.quickIcons.title || "")}</p>
              <ul class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
                ${data.quickIcons.items.map(it => `
                  <li>
                    <a href="${esc(it.url || "#")}" class="group flex items-center justify-center gap-2 px-4 py-3 rounded-lg bg-white border border-line hover:border-brand hover:bg-brand-50 transition text-sm font-semibold text-ink">
                      <span class="w-1.5 h-1.5 rounded-full bg-brand group-hover:scale-150 transition"></span>
                      <span>${esc(it.label || "")}</span>
                    </a>
                  </li>
                `).join("")}
              </ul>
            </div>
          </section>
        `;
      }

      // stats
      if (Array.isArray(data.stats) && data.stats.length) {
        html += `
          <section class="bg-brand text-white">
            <div class="container-x py-12 md:py-14">
              <ul class="grid grid-cols-2 lg:grid-cols-4 gap-y-8">
                ${data.stats.map(s => `
                  <li class="flex items-center gap-4 px-4">
                    <div>
                      <p class="text-3xl md:text-4xl font-bold leading-none">${esc(s.value || "")}</p>
                      <p class="text-xs md:text-sm text-brand-100/80 uppercase tracking-wider mt-1">${esc(s.label || "")}</p>
                    </div>
                  </li>
                `).join("")}
              </ul>
            </div>
          </section>
        `;
      }

      // solutions grid (Home)
      if (data.solutions && data.solutions.title) {
        html += `
          <section class="container-x py-20 md:py-24">
            <div class="text-center max-w-2xl mx-auto mb-12">
              <p class="eyebrow justify-center mb-3">${esc(data.solutions.eyebrow || "Apa yang kami kerjakan")}</p>
              <h2 class="text-3xl md:text-4xl font-bold text-balance">${esc(data.solutions.title)}</h2>
              ${data.solutions.subtitle ? `<p class="mt-3 text-ink-muted">${esc(data.solutions.subtitle)}</p>` : ""}
            </div>
            <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
              ${["Data Center","UPS Solution","ICT Infrastructure","Electrical Engineering","Maintenance & Support","Building Solution"].map((t, i) => `
                <div class="card p-7">
                  <div class="w-14 h-14 rounded-lg bg-brand-50 text-brand flex items-center justify-center mb-5">
                    <span class="text-xs font-semibold">0${i + 1}</span>
                  </div>
                  <h3 class="text-lg font-bold mb-2">${esc(t)}</h3>
                  <p class="text-sm text-ink-muted leading-relaxed">Sample card — the real Solutions collection will populate this grid.</p>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      // story timeline
      if (Array.isArray(data.story) && data.story.length) {
        html += `
          <section class="container-x py-16">
            <ul class="space-y-6">
              ${data.story.map(s => `
                <li class="card p-6">
                  <p class="text-sm font-semibold tracking-wider uppercase text-brand">${esc(s.year || "")}</p>
                  <h3 class="text-xl font-bold mt-1">${esc(s.title || "")}</h3>
                  <p class="mt-2 text-ink-muted">${esc(s.description || "")}</p>
                </li>
              `).join("")}
            </ul>
          </section>
        `;
      }

      // vision / mission / values
      if (data.vision || data.mission || data.values) {
        html += `<section class="container-x py-16 grid md:grid-cols-3 gap-6">`;
        if (data.vision) {
          html += `<div class="card p-6">
            <h3 class="text-lg font-bold mb-2">${esc(data.vision.title || "Visi")}</h3>
            <p class="text-ink-muted">${esc(data.vision.text || "")}</p>
          </div>`;
        }
        if (data.mission) {
          html += `<div class="card p-6">
            <h3 class="text-lg font-bold mb-2">${esc(data.mission.title || "Misi")}</h3>
            <ul class="space-y-2 text-ink-muted list-disc pl-5">
              ${(data.mission.items || []).map(m => `<li>${esc(typeof m === "string" ? m : "")}</li>`).join("")}
            </ul>
          </div>`;
        }
        if (Array.isArray(data.values) && data.values.length) {
          html += `<div class="card p-6">
            <h3 class="text-lg font-bold mb-2">Nilai</h3>
            <ul class="space-y-2 text-ink-muted">
              ${data.values.map(v => `<li><strong class="text-ink">${esc(v.title || "")}</strong> — ${esc(v.description || "")}</li>`).join("")}
            </ul>
          </div>`;
        }
        html += `</section>`;
      }

      // contact channels
      if (Array.isArray(data.channels) && data.channels.length) {
        html += `
          <section class="container-x py-16">
            <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
              ${data.channels.map(c => `
                <div class="card p-5">
                  <p class="text-xs uppercase tracking-wider text-ink-muted">${esc(c.label || "")}</p>
                  <p class="mt-1 font-semibold">${esc(c.value || "")}</p>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      // groups (customers)
      if (Array.isArray(data.groups) && data.groups.length) {
        html += `<section class="container-x py-16 space-y-10">`;
        for (const g of data.groups) {
          html += `
            <div>
              <h2 class="text-2xl font-bold mb-4">${esc(g.title || "")}</h2>
              <ul class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
                ${(g.customers || []).map(c => `
                  <li class="card p-4 text-sm font-semibold text-ink-muted">${esc(c.name || "")}</li>
                `).join("")}
              </ul>
            </div>
          `;
        }
        html += `</section>`;
      }

      // partners
      if (Array.isArray(data.partners) && data.partners.length) {
        html += `
          <section class="container-x py-16">
            <ul class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
              ${data.partners.map(p => `
                <li class="flex items-center justify-center h-20 px-3 rounded-lg bg-white border border-line text-center">
                  <span class="text-sm font-semibold text-ink-muted">${esc(p.name || "")}</span>
                </li>
              `).join("")}
            </ul>
          </section>
        `;
      }

      // bottom CTA
      html += ctaBlock(data.cta);

      document.getElementById("root").innerHTML = html;
    }

    // ---- SOLUTION preview ----
    function renderSolution() {
      const data = this.props.entry.get("data").toJS();
      const title = esc(data.title || "Solution");
      const hero = data.hero || {};
      const sd = esc(data.shortDescription || "");
      const desc = esc(data.description || "");

      let html = chrome("solution");

      html += `
        <section class="relative overflow-hidden bg-brand-dark text-white">
          <div class="absolute inset-0 bg-gradient-to-br from-brand-dark via-brand-dark/95 to-brand/80"></div>
          <div class="absolute inset-0 dot-grid opacity-30"></div>
          <div class="relative container-x py-20 md:py-28">
            ${hero.tagline ? `<p class="eyebrow !text-brand-200 mb-4"><span class="!bg-brand-200"></span>${esc(hero.tagline)}</p>` : ""}
            <h1 class="text-4xl md:text-5xl font-bold text-balance max-w-3xl">${esc(hero.heading || title)}</h1>
            ${sd ? `<p class="mt-4 text-lg text-brand-100/90 max-w-2xl">${sd}</p>` : ""}
          </div>
        </section>
      `;

      if (desc) {
        html += `
          <section class="container-x py-16 max-w-3xl">
            <p class="text-lg text-ink-muted leading-relaxed">${desc}</p>
          </section>
        `;
      }

      if (Array.isArray(data.features) && data.features.length) {
        html += `
          <section class="container-x py-12">
            <div class="grid sm:grid-cols-3 gap-6">
              ${data.features.map(f => `
                <div class="card p-6">
                  <h3 class="text-lg font-bold mb-2">${esc(f.title || "")}</h3>
                  <p class="text-sm text-ink-muted leading-relaxed">${esc(f.description || "")}</p>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      if (Array.isArray(data.specs) && data.specs.length) {
        html += `
          <section class="container-x py-12">
            <div class="card p-6 bg-cream">
              <h2 class="text-2xl font-bold mb-6">At a glance</h2>
              <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
                ${data.specs.map(s => `
                  <div>
                    <p class="text-xs uppercase tracking-widest text-ink-muted">${esc(s.label || "")}</p>
                    <p class="mt-1 font-semibold">${esc(s.value || "")}</p>
                  </div>
                `).join("")}
              </div>
            </div>
          </section>
        `;
      }

      if (Array.isArray(data.customers) && data.customers.length) {
        html += `
          <section class="container-x py-12">
            <h2 class="text-2xl font-bold mb-6">Selected customers</h2>
            <ul class="grid sm:grid-cols-3 lg:grid-cols-4 gap-3">
              ${data.customers.map(c => `
                <li class="card p-4 text-sm font-semibold text-ink-muted">${esc(c.name || "")}</li>
              `).join("")}
            </ul>
          </section>
        `;
      }

      html += ctaBlock(data.cta);

      document.getElementById("root").innerHTML = html;
    }

    // ---- POST preview ----
    function renderPost() {
      const data = this.props.entry.get("data").toJS();
      const title = esc(data.title || "Untitled");
      const date = esc(data.date || "");
      const description = esc(data.description || "");
      const image = imgUrl(data.image);
      const body = esc(data.body || "").replace(/\n/g, "<br>");

      let html = chrome("post");

      html += `
        <section class="container-x py-16 max-w-3xl">
          ${date ? `<p class="text-sm text-ink-muted uppercase tracking-wider">${date}</p>` : ""}
          <h1 class="text-4xl md:text-5xl font-bold text-balance mt-3">${title}</h1>
          ${description ? `<p class="mt-4 text-lg text-ink-muted leading-relaxed">${description}</p>` : ""}
          ${image ? `<img src="${esc(image)}" alt="" class="mt-8 w-full rounded-2xl object-cover aspect-[16/9]">` : ""}
        </section>
        <section class="container-x pb-24 max-w-3xl">
          <div class="prose max-w-none text-ink-muted leading-relaxed">${body}</div>
        </section>
      `;

      document.getElementById("root").innerHTML = html;
    }

    // ---- SITE SETTINGS preview ----
    function renderSettings() {
      const data = this.props.entry.get("data").toJS();
      const site = data.site || {};
      const social = data.social || {};
      const footer = data.footer || {};

      let html = chrome("site settings");

      html += `
        <section class="container-x py-16">
          <p class="eyebrow mb-3">Brand</p>
          <h1 class="text-4xl font-bold text-balance">${esc(site.name || "")}</h1>
          <p class="mt-2 text-lg text-ink-muted">${esc(site.tagline || "")}</p>
          <p class="mt-2 text-ink-muted max-w-2xl">${esc(site.shortDescription || "")}</p>
        </section>

        <section class="container-x pb-12">
          <p class="eyebrow mb-4">Contact</p>
          <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="card p-5">
              <p class="text-xs uppercase tracking-widest text-ink-muted">Phone</p>
              <p class="mt-1 font-semibold">${esc(site.phone || "")}</p>
            </div>
            <div class="card p-5">
              <p class="text-xs uppercase tracking-widest text-ink-muted">WhatsApp</p>
              <p class="mt-1 font-semibold">${esc(site.whatsappDisplay || "")}</p>
            </div>
            <div class="card p-5">
              <p class="text-xs uppercase tracking-widest text-ink-muted">Email</p>
              <p class="mt-1 font-semibold">${esc(site.email || "")}</p>
            </div>
            <div class="card p-5">
              <p class="text-xs uppercase tracking-widest text-ink-muted">Address</p>
              <p class="mt-1 font-semibold">${esc(site.address || "")}</p>
            </div>
          </div>
        </section>

        <section class="container-x pb-12">
          <p class="eyebrow mb-4">Footer columns</p>
          <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
            ${(footer.columns || []).map(col => `
              <div class="card p-5">
                <h3 class="text-sm font-semibold text-ink tracking-wider uppercase mb-3">${esc(col.heading || "")}</h3>
                <ul class="space-y-2 text-sm">
                  ${(col.links || []).map(l => `<li><a href="${esc(l.url || "#")}" class="text-ink-muted hover:text-brand transition">${esc(l.label || "")}</a></li>`).join("")}
                </ul>
              </div>
            `).join("")}
          </div>
        </section>

        <section class="container-x pb-12">
          <p class="eyebrow mb-4">Certifications</p>
          <div class="flex flex-wrap gap-2">
            ${(footer.certifications || []).map(c => `<span class="badge">${esc(c.label || "")}</span>`).join("")}
          </div>
        </section>

        <section class="container-x pb-24">
          <p class="eyebrow mb-4">Social</p>
          <ul class="space-y-1 text-sm">
            ${Object.entries(social).filter(([k, v]) => v).map(([k, v]) => `<li><strong class="capitalize">${esc(k)}</strong>: <a class="text-brand" href="${esc(v)}">${esc(v)}</a></li>`).join("")}
          </ul>
        </section>
      `;

      document.getElementById("root").innerHTML = html;
    }

    // CSS is inlined into <head> at build time by scripts/copy-cms-preview.js
    // so it works inside the srcdoc iframe regardless of baseURI.

    CMS.registerPreviewTemplate("pages", renderPage);
    CMS.registerPreviewTemplate("pages_en", renderPage);
    CMS.registerPreviewTemplate("solutions", renderSolution);
    CMS.registerPreviewTemplate("solutions_en", renderSolution);
    CMS.registerPreviewTemplate("posts", renderPost);
    CMS.registerPreviewTemplate("posts_en", renderPost);
    CMS.registerPreviewTemplate("site_settings", renderSettings);
  </script>
</head>
<body>
  <div id="root">
    <p style="padding:2rem; color:#475569;">Loading preview…</p>
  </div>
</body>
</html>
