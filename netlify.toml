[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NPM_FLAGS = "--include=optional"

# Required for `tinacms build` and for Next.js to read content from TinaCloud.
# Set these in the Netlify UI (Site settings > Environment variables):
#
#   NEXT_PUBLIC_TINA_CLIENT_ID = <from https://app.tina.io — project Overview tab>
#   TINA_TOKEN                = <from https://app.tina.io — project Tokens tab>
#
# NEXT_PUBLIC_TINA_BRANCH is optional; it defaults to Netlify's HEAD variable.

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "public, max-age=0, must-revalidate"
